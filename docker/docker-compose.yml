version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: percept-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: percept-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ../backend:/app
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
